# Settings the operator enforces on every herdr host.
# Plain keys are set in place; every [[keys.command]] entry is owned by the
# operator (tagged on the host, replaced wholesale on each apply).

[keys]
prefix = "ctrl+a"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "tmux new-session -A -s scratch"
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "tmux new-session -A -s \"lazygit-$(printf %s \"${PWD##*/}\" | tr -c 'A-Za-z0-9_-' '_')-$(printf %s \"$PWD\" | cksum | cut -d' ' -f1)\" -c \"$PWD\" 'PATH=\"$HOME/.local/bin:$PATH\" lazygit'"
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+m"
type = "popup"
command = "btop"
description = "open btop"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+q"
type = "popup"
command = "tmux new-session -A -s ask 'PATH=\"$HOME/.local/bin:$PATH\" claude --model claude-haiku-5-5'"
description = "quick question to claude (haiku)"
width = "80%"
height = "80%"
