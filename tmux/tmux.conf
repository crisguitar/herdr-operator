unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g set-clipboard on

# Dracula status bar
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 45
set -g status-left "#{?client_prefix,#[bg=#ff79c6]#[fg=#282a36]#[bold] PREFIX #[default] #[fg=#8be9fd]#[bold]esc#[fg=#f8f8f2]#[nobold] cancel #[fg=#8be9fd]#[bold]d#[fg=#f8f8f2]#[nobold] detach ,#[fg=#bd93f9]#[bold] #S    }"
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#44475a]#[fg=#f8f8f2]#[bold] #I:#W "
set -g window-status-style "fg=#6272a4"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g pane-active-border-style "fg=#bd93f9"
set -g pane-border-style "fg=#44475a"
